name: CI

# Constitution III: formatting, lint, types and tests pass before anything merges.
# Constitution II: the import-boundary checks run in both runtimes on every push.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint, including import boundaries
        run: npm run lint
      - name: Type check, with generated route types
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Sign-in (T024) runs against a real Supabase Auth, so the app is built and tested against a
      # local stack. The keys printed by `supabase status` are the stack's fixed development keys.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Start Postgres, Auth, Storage and the API gateway
        working-directory: .
        # config.toml enables Google sign-in with env() values; CI never reaches Google, so any
        # well-formed placeholder will do.
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
        run: >-
          supabase start -x
          realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Point the app and the tests at the local stack
        working-directory: .
        run: |
          supabase status -o env | tr -d '"' | sed -n \
            -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' \
            -e 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p' \
            -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' >> "$GITHUB_ENV"
          echo "SITE_URL=http://localhost:3000" >> "$GITHUB_ENV"
      - name: Production build
        run: npm run build
      - name: Browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests, against the production build
        run: npm run test:e2e

  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: pipeline
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run mypy
      - name: Import boundaries
        run: uv run lint-imports
      - name: Unit tests
        run: uv run pytest -m "not database"

  database:
    name: Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Start Postgres, Auth and Storage
        # config.toml enables Google sign-in with env() values; CI never reaches Google, so any
        # well-formed placeholder will do.
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
        run: >-
          supabase start -x
          realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: pipeline
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
        working-directory: pipeline
      - name: Tenant isolation and schema tests
        run: uv run pytest -m database
        working-directory: pipeline
