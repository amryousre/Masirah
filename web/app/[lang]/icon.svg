<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The mark (DESIGN.md section 3): the M-tick from the Masirah logo, an M whose tick rises out of
       its valley, yellow on black at the owner's request. A faint edge keeps the tile visible on
       dark browser chrome, and a black gap sets the tick apart from the legs, as the logo does by
       shade. -->
