<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The M-tick mark from the Masirah logo (Canva: "Masirah logo · English (M-tick wordmark)"),
       yellow on black at the owner's request: an M whose tick rises out of it, for a shortlist. -->
  <rect width="32" height="32" rx="7" fill="#0b0b0b" />
  <g fill="#ffc72c">
    <path d="M5.5 26.5V8h4.4l3.2 4.4v14.1z" />
    <path d="M21 14.4 25.6 8.4v18.1H21z" />
    <!-- The tick sits over the legs with a black edge, as the logo sets it apart by shade. -->
    <path d="M10.2 13.2 16 21.4 27.4 4.4l2.9 2.1L16.1 27.2 7.4 15.2z" stroke="#0b0b0b" stroke-width="1.4" stroke-linejoin="round" paint-order="stroke" />
  </g>
</svg>
