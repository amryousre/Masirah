  <g fill="#ffc72c" transform="translate(16 16) scale(0.94) translate(-17.4 -15.8)">
    <path d="M5.5 26.5V8h4.4l3.2 4.4v14.1z" />
    <path d="M21 13h4.6v13.5H21z" />
    <path d="M10.2 13.2 16 21.4 27.4 4.4l2.9 2.1L16.1 27.2 7.4 15.2z" stroke="#0b0b0b" stroke-width="2.4" stroke-linejoin="round" paint-order="stroke" />
  </g>
</svg>
